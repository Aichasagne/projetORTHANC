<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examens - Projet Médical</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #0f172a;
            margin: 0;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.2;
        }

        .sidebar {
            width: 250px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 1.5rem;
            height: 100vh;
            position: fixed;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: slideIn 0.5s ease-out;
        }

        .sidebar h1 {
            font-size: 1.5rem;
            font-weight: 700;
            text-shadow: 0 0 10px #06b6d4;
            margin-bottom: 2rem;
        }

        .sidebar a {
            display: flex;
            align-items: center;
            color: white;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
            position: relative;
        }

        .sidebar a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: #06b6d4;
            transition: width 0.3s ease;
        }

        .sidebar a:hover::after {
            width: 100%;
        }

        .sidebar a:hover {
            background: rgba(6, 182, 212, 0.2);
            transform: translateX(5px);
        }

        .sidebar a i {
            margin-right: 0.5rem;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .sidebar a:hover i {
            transform: scale(1.2);
            filter: drop-shadow(0 0 5px #06b6d4);
        }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
            width: calc(100% - 250px);
            animation: fadeIn 0.6s ease-out;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(6, 182, 212, 0.3);
        }

        .btn-primary {
            background: linear-gradient(45deg, #06b6d4, #22d3ee);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.4);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: rgba(255, 255, 247, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 2rem;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            animation: popIn 0.4s ease-out;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .input-field:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-label {
            position: absolute;
            top: 12px;
            left: 12px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            pointer-events: none;
            background: transparent;
        }

        .input-field:focus+.input-label,
        .input-field:not(:placeholder-shown)+.input-label {
            top: -8px;
            left: 8px;
            font-size: 12px;
            color: #06b6d4;
            background: rgba(15, 23, 42, 0.8);
            padding: 0 4px;
        }

        .input-field[type="textarea"] {
            resize: vertical;
            min-height: 100px;
        }

        table {
            border-collapse: separate;
            border-spacing: 0 0.5rem;
            width: 100%;
        }

        th {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            font-weight: 600;
            color: #06b6d4;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        td {
            padding: 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            color: white;
            transition: all 0.3s ease;
        }

        tr:hover td {
            background: rgba(6, 182, 212, 0.1);
            transform: scale(1.01);
        }

        @keyframes slideIn {
            from {
                transform: translateX(-100%);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <canvas id="bgCanvas"></canvas>
    <div class="sidebar">
        <div>
            <h1>Projet Médical</h1>
            <a href="dashboard.html"><i class="fas fa-users text-cyan-400"></i> Patients</a>
            <a href="examens.html"><i class="fas fa-stethoscope text-cyan-400"></i> Examens</a>
            <a href="analyse.html"><i class="fas fa-chart-bar text-cyan-400"></i> Analyse</a>
        </div>
        <a href="#" onclick="logout()"><i class="fas fa-sign-out-alt text-cyan-400"></i> Déconnexion</a>
    </div>
    <div class="main-content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-semibold text-white" id="examens-title"></h2>
            <div class="flex items-center space-x-4">
                <span class="text-gray-300">Connecté en tant que : <span class="font-semibold text-cyan-400"
                        id="user-role"></span></span>
                <div id="add-examen-button"></div>
            </div>
        </div>
        <div class="card" id="examens-content">
            <!-- Contenu dynamique selon le rôle -->
        </div>
        <div id="add-examen-modal" class="modal">
            <div class="modal-content">
                <h3 class="text-xl font-semibold mb-4 text-white">Ajouter un Examen</h3>
                <form id="add-examen-form" class="space-y-4">
                    <div class="input-group">
                        <select id="patient_id" class="input-field" required>
                            <option value="" disabled selected>Sélectionner un patient</option>
                        </select>
                        <label for="patient_id" class="input-label">Patient</label>
                    </div>
                    <div class="input-group">
                        <select id="medecin_id" class="input-field" required>
                            <option value="" disabled selected>Sélectionner un médecin</option>
                        </select>
                        <label for="medecin_id" class="input-label">Médecin</label>
                    </div>
                    <div class="input-group">
                        <select id="radiologue_id" class="input-field" required>
                            <option value="" disabled selected>Sélectionner un radiologue</option>
                        </select>
                        <label for="radiologue_id" class="input-label">Radiologue</label>
                    </div>
                    <div class="input-group">
                        <input type="text" id="type_examen" class="input-field" placeholder=" " required>
                        <label for="type_examen" class="input-label">Type d'Examen</label>
                    </div>
                    <div class="input-group">
                        <input type="date" id="date_examen" class="input-field" placeholder=" " required>
                        <label for="date_examen" class="input-label">Date de l'Examen</label>
                    </div>
                    <div class="input-group">
                        <select id="statut" class="input-field" required>
                            <option value="" disabled selected>Sélectionner un statut</option>
                            <option value="En attente">En attente</option>
                            <option value="Terminé">Terminé</option>
                            <option value="Annulé">Annulé</option>
                        </select>
                        <label for="statut" class="input-label">Statut</label>
                    </div>
                    <div class="input-group">
                        <textarea id="resultat" class="input-field" placeholder=" "></textarea>
                        <label for="resultat" class="input-label">Résultat (optionnel)</label>
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button"
                            class="px-4 py-2 text-gray-300 hover:text-white transition-colors duration-200"
                            onclick="closeAddExamenModal()">Annuler</button>
                        <button type="submit" class="btn-primary"><i class="fas fa-plus mr-2"></i> Ajouter</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        const role = localStorage.getItem('role');

        if (!token || !role) {
            console.log('Token ou rôle manquant, redirection vers login.html');
            window.location.href = 'login.html';
        }

        document.getElementById('user-role').textContent = role;

        async function loadExamenPage() {
            if (role === 'medecin' || role === 'admin') {
                document.getElementById('examens-title').textContent = 'Gestion des Examens';
                document.getElementById('add-examen-button').innerHTML = `
                    <button class="btn-primary" onclick="openAddExamenModal()">
                        <i class="fas fa-plus mr-2"></i> Ajouter un Examen
                    </button>`;
                document.getElementById('examens-content').innerHTML = `
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-600">
                                <th class="p-4">Patient</th>
                                <th class="p-4">Type d'Examen</th>
                                <th class="p-4">Date de l'Examen</th>
                                <th class="p-4">Statut</th>
                                <th class="p-4">Résultat</th>
                            </tr>
                        </thead>
                        <tbody id="examens-table" class="text-gray-800"></tbody>
                    </table>`;
                await loadExamens();
                await loadPatientsForDropdown();
                await loadMedecinsForDropdown();
                await loadRadiologuesForDropdown();
            } else if (role === 'patient') {
                document.getElementById('examens-title').textContent = 'Mes Examens';
                document.getElementById('add-examen-button').innerHTML = '';
                document.getElementById('examens-content').innerHTML = `
                    <table class="w-full text-left">
                        <thead>
                            <tr class="text-gray-600">
                                <th class="p-4">Type d'Examen</th>
                                <th class="p-4">Date de l'Examen</th>
                                <th class="p-4">Statut</th>
                                <th class="p-4">Résultat</th>
                            </tr>
                        </thead>
                        <tbody id="examens-table" class="text-gray-800"></tbody>
                    </table>`;
                await loadExamens();
            } else {
                console.log('Rôle non reconnu:', role);
                alert('Rôle non reconnu. Veuillez vous reconnecter.');
                logout();
            }
        }

        async function loadExamens() {
            try {
                console.log('Chargement des examens avec token:', token);
                const response = await fetch('http://localhost/projet-medical/api/examens', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    console.log('Erreur lors du chargement des examens:', data.error);
                    alert(data.error);
                    return;
                }

                const tableBody = document.getElementById('examens-table');
                tableBody.innerHTML = '';
                data.examens.forEach(examen => {
                    const row = document.createElement('tr');
                    if (role === 'medecin' || role === 'admin') {
                        row.innerHTML = `
                            <td class="p-4">${examen.nom} ${examen.prenom}</td>
                            <td class="p-4">${examen.type_examen}</td>
                            <td class="p-4">${examen.date_examen}</td>
                            <td class="p-4">${examen.statut || 'Non défini'}</td>
                            <td class="p-4">${examen.resultat || 'Non disponible'}</td>`;
                    } else {
                        row.innerHTML = `
                            <td class="p-4">${examen.type_examen}</td>
                            <td class="p-4">${examen.date_examen}</td>
                            <td class="p-4">${examen.statut || 'Non défini'}</td>
                            <td class="p-4">${examen.resultat || 'Non disponible'}</td>`;
                    }
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des examens:', error);
                alert('Erreur lors du chargement des examens: ' + error.message);
            }
        }

        async function loadPatientsForDropdown() {
            try {
                console.log('Chargement des patients avec token:', token);
                const response = await fetch('http://localhost/projet-medical/api/patients', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    console.log('Erreur lors du chargement des patients:', data.error);
                    alert(data.error);
                    return;
                }

                const patientSelect = document.getElementById('patient_id');
                patientSelect.innerHTML = '<option value="" disabled selected>Sélectionner un patient</option>';
                data.patients.forEach(patient => {
                    const option = document.createElement('option');
                    option.value = patient.id;
                    option.textContent = `${patient.nom} ${patient.prenom}`;
                    patientSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des patients:', error);
                alert('Erreur lors du chargement des patients pour le menu déroulant: ' + error.message);
            }
        }

        async function loadMedecinsForDropdown() {
            try {
                console.log('Chargement des médecins avec token:', token);
                const response = await fetch('http://localhost/projet-medical/api/medecins', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    console.log('Erreur lors du chargement des médecins:', data.error);
                    alert(data.error);
                    return;
                }

                const medecinSelect = document.getElementById('medecin_id');
                medecinSelect.innerHTML = '<option value="" disabled selected>Sélectionner un médecin</option>';
                data.medecins.forEach(medecin => {
                    const option = document.createElement('option');
                    option.value = medecin.id;
                    option.textContent = `${medecin.nom} ${medecin.prenom}`;
                    medecinSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des médecins:', error);
                alert('Erreur lors du chargement des médecins pour le menu déroulant: ' + error.message);
            }
        }

        async function loadRadiologuesForDropdown() {
            try {
                console.log('Chargement des radiologues avec token:', token);
                const response = await fetch('http://localhost/projet-medical/api/radiologues', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                if (data.error) {
                    console.log('Erreur lors du chargement des radiologues:', data.error);
                    alert(data.error);
                    return;
                }

                const radiologueSelect = document.getElementById('radiologue_id');
                radiologueSelect.innerHTML = '<option value="" disabled selected>Sélectionner un radiologue</option>';
                data.radiologues.forEach(radiologue => {
                    const option = document.createElement('option');
                    option.value = radiologue.id;
                    option.textContent = `${radiologue.nom} ${radiologue.prenom}`;
                    radiologueSelect.appendChild(option);
                });
            } catch (error) {
                console.error('Erreur lors du chargement des radiologues:', error);
                alert('Erreur lors du chargement des radiologues pour le menu déroulant: ' + error.message);
            }
        }

        function openAddExamenModal() {
            document.getElementById('add-examen-modal').style.display = 'flex';
        }

        function closeAddExamenModal() {
            document.getElementById('add-examen-modal').style.display = 'none';
            document.getElementById('add-examen-form').reset();
        }

        document.getElementById('add-examen-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                patient_id: document.getElementById('patient_id').value,
                medecin_id: document.getElementById('medecin_id').value,
                radiologue_id: document.getElementById('radiologue_id').value,
                type_examen: document.getElementById('type_examen').value,
                date_examen: document.getElementById('date_examen').value,
                statut: document.getElementById('statut').value,
                resultat: document.getElementById('resultat').value || null
            };

            console.log('Données envoyées :', data);
            console.log('Token utilisé pour la requête :', token);

            try {
                const response = await fetch('http://localhost/projet-medical/api/examens', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                console.log('Réponse API :', result);
                if (result.error) {
                    console.error('Erreur API :', result.error);
                    alert('Erreur lors de l\'ajout de l\'examen : ' + result.error);
                } else {
                    alert('Examen ajouté avec succès');
                    closeAddExamenModal();
                    loadExamens();
                }
            } catch (error) {
                console.error('Erreur lors de l\'envoi :', error);
                alert('Erreur lors de l\'ajout de l\'examen : ' + error.message);
            }
        });

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('role');
            window.location.href = 'login.html';
        }

        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(6, 182, 212, 0.5)";
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        loadExamenPage();
    </script>
</body>

</html>
