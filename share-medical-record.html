<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dossier Médical Partagé</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Arial', sans-serif; }
        .container { max-width: 800px; margin: 2rem auto; padding: 1rem; }
        #authContainer { display: block; }
        #content { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-2xl font-bold mb-4">Dossier Médical Partagé</h1>
        <div id="authContainer" class="bg-gray-800 p-4 rounded-lg shadow-inner">
            <h2 class="text-lg font-semibold mb-2">Authentification Requise</h2>
            <input type="password" id="passwordInput" class="w-full p-2 mb-2 bg-gray-700 border border-gray-600 rounded" placeholder="Entrez le mot de passe">
            <button onclick="verifyPassword()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Soumettre</button>
        </div>
        <div id="content" class="bg-gray-800 p-4 rounded-lg shadow-inner"></div>
        <p id="protectedMessage" class="mt-4 text-gray-400">Ce dossier est protégé. Veuillez vous connecter pour voir les détails complets.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const patientId = urlParams.get('patientId');
        const token = urlParams.get('token');
        const storedToken = localStorage.getItem(`share_${patientId}_token`);
        const storedPassword = localStorage.getItem(`share_${patientId}_password`);

        console.log('Paramètres:', { patientId, token, storedToken, storedPassword });

        function verifyPassword() {
            const passwordInput = document.getElementById('passwordInput').value;
            console.log('Mot de passe entré:', passwordInput);
            if (passwordInput === storedPassword && token === storedToken) {
                document.getElementById('authContainer').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                document.getElementById('protectedMessage').style.display = 'none';

                // Récupérer les données actualisées depuis l'API
                fetch(`http://localhost/projet-medical/api/medical-records.php?patientId=${patientId}`, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' }
                })
                .then(response => {
                    console.log('Réponse GET:', response.status, response.statusText);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.json();
                })
                .then(data => {
                    console.log('Données reçues:', data);
                    if (data.error) throw new Error(data.error);
                    document.getElementById('content').innerHTML = `
                        <h2 class="text-xl font-semibold mb-2">Dossier Médical - Patient ID: ${patientId}</h2>
                        <p><strong>État de Santé:</strong> ${data.etat_sante || 'Non spécifié'}</p>
                        <p><strong>Allergies:</strong> ${data.allergies || 'Aucune connue'}</p>
                        <p><strong>Groupe Sanguin:</strong> ${data.groupe_sanguin || 'Non défini'}</p>
                        <p><strong>Antécédents Familiaux:</strong> ${data.antecedents_familiaux || 'Aucun connu'}</p>
                        <p><strong>Dernière Mise à Jour:</strong> ${data.last_updated ? new Date(data.last_updated).toLocaleString('fr-FR') : 'Non défini'}</p>
                    `;
                })
                .catch(error => {
                    console.error('Erreur lors de la récupération:', error);
                    document.getElementById('content').innerHTML = `<p class="text-red-400">Erreur: ${error.message}</p>`;
                });
            } else {
                document.getElementById('content').innerHTML = '';
                document.getElementById('protectedMessage').style.display = 'block';
            }
        }

        if (!patientId || !token || token !== storedToken) {
            console.log('Validation échouée:', { patientId, token, storedToken });
            document.getElementById('content').innerHTML = '';
            document.getElementById('protectedMessage').style.display = 'block';
        }
    </script>
</body>
</html>
