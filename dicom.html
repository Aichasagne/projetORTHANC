<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orthanc - Lookup Studies</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: #0f172a;
            /* Fond sombre futuriste */
            overflow-x: hidden;
        }

        /* Canvas pour particules de fond */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.2;
        }

        /* Header avec glassmorphism */
        .header {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
        }

        .nav-left a,
        .nav-right a {
            color: white;
            margin: 0 10px;
            font-size: 14px;
            position: relative;
            transition: color 0.3s ease;
        }

        .nav-left a::after,
        .nav-right a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: #06b6d4;
            transition: width 0.3s ease;
        }

        .nav-left a:hover::after,
        .nav-right a::after {
            width: 100%;
        }

        .nav-left a:hover,
        .nav-right a:hover {
            color: #06b6d4;
        }

        .title {
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 0 0 10px #06b6d4;
        }

        /* Logo */
        .logo {
            text-align: center;
            margin: 20px 0;
            animation: fadeIn 1s ease-out;
        }

        .logo h1 {
            color: #06b6d4;
            font-size: 3rem;
            font-weight: 800;
            text-shadow: 0 0 15px #06b6d4;
        }

        /* Contenu principal */
        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.6s ease-out;
        }

        /* Formulaire */
        .form-group {
            margin-bottom: 15px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: white;
            margin-bottom: 5px;
            text-shadow: 0 0 5px #06b6d4;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #06b6d4;
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.2);
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Boutons principaux */
        .buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .buttons button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .all-patients,
        .all-studies {
            background: linear-gradient(45deg, #1e3a8a, #06b6d4);
            color: white;
        }

        .do-lookup {
            background: linear-gradient(45deg, #06b6d4, #22d3ee);
            color: white;
        }

        .buttons button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .buttons button:hover::before {
            left: 100%;
        }

        .buttons button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
        }

        /* Boutons supplémentaires */
        .additional-buttons {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .additional-buttons button {
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: all 0.3s ease;
        }

        .additional-buttons button:hover {
            background: rgba(6, 182, 212, 0.2);
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(6, 182, 212, 0.3);
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideIn {
            from {
                transform: translateY(20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <!-- Canvas pour particules de fond -->
    <canvas id="bgCanvas"></canvas>

    <!-- En-tête -->
    <div class="header">
        <div class="nav-left">
            <a href="#">LOOKUP</a>
            <a href="#">Plugins</a>
        </div>
        <div class="title">Orthanc Demo » Lookup studies</div>
        <div class="nav-right">
            <a href="#">Upload</a>
            <a href="#">Query/Retrieve</a>
            <a href="#">Jobs</a>
        </div>
    </div>

    <!-- Logo -->
    <div class="logo">
        <h1>ORTHANC</h1>
    </div>

    <!-- Contenu principal -->
    <div class="content">
        <div class="form-group">
            <label for="patient-id">Patient ID:</label>
            <input type="text" id="patient-id" name="patient-id" placeholder="Entrez l'ID du patient">
        </div>
        <div class="form-group">
            <label for="patient-name">Patient Name:</label>
            <input type="text" id="patient-name" name="patient-name" placeholder="Entrez le nom du patient">
        </div>
        <div class="form-group">
            <label for="accession-number">Accession Number:</label>
            <input type="text" id="accession-number" name="accession-number" placeholder="Entrez le numéro d'accès">
        </div>
        <div class="form-group">
            <label for="study-description">Study Description:</label>
            <input type="text" id="study-description" name="study-description"
                placeholder="Entrez la description de l'étude">
        </div>
        <div class="form-group">
            <label for="labels">Labels:</label>
            <input type="text" id="labels" name="labels" placeholder="Entrez les labels">
        </div>
        <div class="form-group">
            <label for="study-date">Study Date:</label>
            <select id="study-date" name="study-date">
                <option value="">Any date</option>
                <!-- Ajoutez d'autres options de date si nécessaire -->
            </select>
        </div>

        <!-- Boutons principaux -->
        <div class="buttons">
            <button class="all-patients"><i class="fas fa-users mr-2"></i>ALL patients</button>
            <button class="all-studies"><i class="fas fa-folder-open mr-2"></i>ALL studies</button>
            <button class="do-lookup"><i class="fas fa-search mr-2"></i>Do lookup</button>
        </div>

        <!-- Boutons supplémentaires -->
        <div class="additional-buttons">
            <button onclick="openOrthancExplorer()"><i class="fas fa-globe mr-2"></i>OPEN Orthanc Explorer 2</button>
            <button onclick="openOHIF()"><i class="fas fa-x-ray mr-2"></i>OPEN OHIF study list</button>
            <button onclick="openDICOMweb()"><i class="fas fa-network-wired mr-2"></i>OPEN DICOMweb client</button>
        </div>
    </div>

    <!-- JavaScript pour gérer les clics et particules -->
    <script>
        // Gestion des boutons principaux
        document.querySelector(".all-patients").addEventListener("click", function () {
            alert("Affichage de tous les patients...");
            // Ajoutez ici la logique pour afficher tous les patients
        });

        document.querySelector(".all-studies").addEventListener("click", function () {
            alert("Affichage de toutes les études...");
            // Ajoutez ici la logique pour afficher toutes les études
        });

        document.querySelector(".do-lookup").addEventListener("click", function () {
            alert("Recherche en cours...");
            // Ajoutez ici la logique pour effectuer la recherche
        });

        function openOrthancExplorer() {
            alert("Ouverture de Orthanc Explorer 2...");
            // Remplacez par une redirection ou une action réelle
            // window.location.href = "URL_de_Orthanc_Explorer_2";
        }

        function openOHIF() {
            alert("Ouverture de la liste des études OHIF...");
            // Remplacez par une redirection ou une action réelle
            // window.location.href = "URL_de_OHIF_study_list";
        }

        function openDICOMweb() {
            alert("Ouverture du client DICOMweb...");
            // Remplacez par une redirection ou une action réelle
            // window.location.href = "URL_de_DICOMweb_client";
        }

        // Particules de fond
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 1,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            });
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(6, 182, 212, 0.5)';
                ctx.fill();
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>

</html>
